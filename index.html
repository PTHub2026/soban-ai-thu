<style>
:root{
  --page:#f6f7f9; --surface:#ffffff; --ink:#0b0b0b; --ink2:#52514e; --muted:#6b6963;
  --grid:#e5e4de; --border:rgba(11,11,11,.09);
  --accent:#2a78d6; --accent-deep:#1c5cab; --navy:#1f3864;
  --good:#0ca30c; --good-text:#006300; --warn:#fab219; --serious:#ec835a; --critical:#d03b3b;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--page);color:var(--ink);line-height:1.42;font-size:15px}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
.num{font-variant-numeric:tabular-nums}
/* ---- phone frame on desktop ---- */
.phone{height:100dvh;display:flex;flex-direction:column;background:var(--page);max-width:520px;margin:0 auto;position:relative}
@media(min-width:641px){
  body{background:linear-gradient(160deg,#e9edf4,#dfe4ec);display:flex;align-items:center;justify-content:center;min-height:100vh;padding:26px 0}
  .phone{width:404px;height:min(872px,calc(100vh - 52px));border-radius:46px;background:var(--page);box-shadow:0 0 0 11px #0d0d0f,0 0 0 13px #3a3a40,0 34px 90px -30px rgba(15,23,42,.55);overflow:hidden}
}
/* ---- status bar / app bar ---- */
.statusbar{display:flex;justify-content:space-between;align-items:center;padding:10px 22px 4px;font-size:.78rem;font-weight:600;color:var(--ink)}
.appbar{display:flex;align-items:center;gap:10px;padding:8px 16px 10px;background:transparent}
.appbar .ttl{font-size:1.22rem;font-weight:800;letter-spacing:-.01em;flex:1;min-width:0}
.appbar .sub{display:block;font-size:.72rem;color:var(--muted);font-weight:400;margin-top:1px}
.iconbtn{width:38px;height:38px;border-radius:12px;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:1.02rem;position:relative;flex-shrink:0}
.iconbtn .dot{position:absolute;top:7px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--critical);border:1.5px solid #fff}
.back{font-size:1.15rem;font-weight:700}
/* ---- main scroll ---- */
main{flex:1;overflow-y:auto;padding:2px 14px 16px;overscroll-behavior:contain}
/* ---- tab bar ---- */
.tabbar{display:flex;background:var(--surface);border-top:1px solid var(--grid);padding:6px 6px calc(8px + env(safe-area-inset-bottom))}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 0;border-radius:12px;color:var(--muted);font-size:.62rem;font-weight:600;position:relative}

 return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="width:100%;height:${h}px;display:block"><polygon points="3,${h-2} ${pts} ${w-3},${h-2}" fill="${color}" opacity=".1"/><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" vector-effect="non-scaling-stroke"/><circle cx="${X(vals.length-1)}" cy="${Y(vals[vals.length-1])}" r="3" fill="${color}"/></svg>`;}
function donutMulti(segs,size,cl,cs){size=size||128;const r=(size-22)/2,c=2*Math.PI*r,tot=segs.reduce((a,s)=>a+s[1],0);let off=0,g='';
 segs.forEach(s=>{const len=s[1]/tot*c;g+=`<circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${s[2]}" stroke-width="15" stroke-dasharray="${Math.max(.5,len-2.4)} ${c}" stroke-dashoffset="${-off}" transform="rotate(-90 ${size/2} ${size/2})"/>`;off+=len;});
 return `<div style="display:flex;align-items:center;gap:13px"><svg viewBox="0 0 ${size} ${size}" style="width:${size*0.82}px;flex-shrink:0">${g}<text class="v" x="50%" y="48%" text-anchor="middle" font-size="${size/6.4}" font-weight="700" fill="#0b0b0b">${cl}</text><text x="50%" y="48%" dy="${size/8}" text-anchor="middle" font-size="${size/13}" fill="#6b6963">${cs||''}</text></svg><div class="statlegend" style="flex:1">${segs.map(s=>`<span><i style="background:${s[2]}"></i>${s[0]}<b class="num">${Math.round(s[1]/tot*100)}%</b></span>`).join('')}</div></div>`;}
function colChart(labels,vals,color){const W=340,H=150,P={l:26,r:6,t:16,b:20};
 const mx=Math.ceil(Math.max(...vals)*1.15),pw=(W-P.l-P.r)/vals.length,bw=pw*.58;
 const Y=v=>P.t+(1-v/mx)*(H-P.t-P.b);let g='';
 for(let k=0;k<=3;k++){const v=mx*k/3,y=Y(v);g+=`<line x1="${P.l}" y1="${y}" x2="${W-P.r}" y2="${y}" stroke="#e5e4de"/><text class="v" x="${P.l-5}" y="${y+3}" font-size="8.5" fill="#6b6963" text-anchor="end">${Math.round(v)}</text>`;}
 const mxi=vals.indexOf(Math.max(...vals));
 vals.forEach((v,i)=>{const x=P.l+i*pw+(pw-bw)/2,y=Y(v),h=Y(0)-y;
  g+=`<path d="M${x},${y+3} a3,3 0 0 1 3,-3 h${bw-6} a3,3 0 0 1 3,3 v${h-3} h${-bw} Z" fill="${color}"/>`;
  if(i===mxi||i===vals.length-1)g+=`<text class="v" x="${x+bw/2}" y="${y-4}" font-size="8.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">${v}</text>`;
  g+=`<text x="${x+bw/2}" y="${H-6}" font-size="8.5" fill="#6b6963" text-anchor="middle">${labels[i]}</text>`;});
 return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">${g}</svg>`;}
function curveChart(vals,color){const W=340,H=140,P={l:26,r:8,t:12,b:16},n=vals.length;
 const mx=Math.ceil(Math.max(...vals)*1.15);
 const X=i=>P.l+i*(W-P.l-P.r)/(n-1),Y=v=>P.t+(1-v/mx)*(H-P.t-P.b);
 let g='';for(let k=0;k<=3;k++){const v=mx*k/3,y=Y(v);g+=`<line x1="${P.l}" y1="${y}" x2="${W-P.r}" y2="${y}" stroke="#e5e4de"/><text class="v" x="${P.l-5}" y="${y+3}" font-size="8.5" fill="#6b6963" text-anchor="end">${Math.round(v)}</text>`;}
 let d='M'+X(0)+','+Y(vals[0]);
 for(let i=0;i<n-1;i++){const x0=X(Math.max(0,i-1)),y0=Y(vals[Math.max(0,i-1)]),x1=X(i),y1=Y(vals[i]),x2=X(i+1),y2=Y(vals[i+1]),x3=X(Math.min(n-1,i+2)),y3=Y(vals[Math.min(n-1,i+2)]);
  d+=` C${(x1+(x2-x0)/6).toFixed(1)},${(y1+(y2-y0)/6).toFixed(1)} ${(x2-(x3-x1)/6).toFixed(1)},${(y2-(y3-y1)/6).toFixed(1)} ${x2.toFixed(1)},${y2.toFixed(1)}`;}
 for(let i=0;i<n;i+=5){g+=`<text x="${X(i)}" y="${H-4}" font-size="8.5" fill="#6b6963" text-anchor="middle">${i+1}</text>`;}
 const li=n-1;
 return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">${g}<path d="${d} L${X(li)},${Y(0)} L${X(0)},${Y(0)} Z" fill="${color}" opacity=".08"/><path d="${d}" fill="none" stroke="${color}" stroke-width="2"/><circle cx="${X(li)}" cy="${Y(vals[li])}" r="3.4" fill="${color}" stroke="#fff" stroke-width="1.6"/></svg>`;}
function hbars(rows){const max=Math.max(...rows.map(r=>r[1]));
 return rows.map(r=>`<div style="display:flex;align-items:center;gap:8px;margin:7px 0"><span style="flex:0 0 66px;font-size:.7rem;color:var(--ink2)">${r[0]}</span><div style="flex:1;height:13px;background:#f0efec;border-radius:5px;overflow:hidden"><i style="display:block;height:100%;width:${r[1]/max*100}%;background:${r[2]};border-radius:5px"></i></div><b class="num" style="font-size:.72rem;min-width:32px;text-align:right">${r[3]??r[1]}</b></div>`).join('');}

function carrierSheet(oid){
  const o=ORDERS.find(x=>x.id===oid);
  const act=CARRIERS.filter(c=>c.st!=='soon');
  const fee=c=>c.phi+(o.cod>700000?3000:0);
  const cheap=act.reduce((a,b)=>fee(a)<=fee(b)?a:b);
  const fast=act.reduce((a,b)=>a.etaH<=b.etaH?a:b);
  const rely=act.reduce((a,b)=>a.ok>=b.ok?a:b);
  const sugg=o.risk>=60?rely:cheap;
  const sel=act.find(c=>c.id===S.vcSel)||sugg;
  openSheet(`<h2>Chọn hãng vận chuyển · ${o.id}</h2>
  <div style="font-size:.72rem;color:var(--ink2)">${o.dc} · COD <b class="num">${fmt(o.cod)} ₫</b> · rủi ro ${o.risk}/100</div>
  ${act.map(c=>`<button class="carrier ${sel.id===c.id?'sel':''}" style="width:100%;text-align:left" onclick="S.vcSel='${c.id}';carrierSheet('${oid}')">
    <span class="cicon" style="background:${c.color}">${c.sh}</span>
    <div style="flex:1;min-width:0"><b style="font-size:.82rem">${c.ten}</b>
      ${c.id===cheap.id?' <span class="tagchip" style="background:#e9f5e9;color:#006300">Rẻ nhất</span>':''}${c.id===fast.id?' <span class="tagchip" style="background:#e8f0fb;color:#1c5cab">Nhanh nhất</span>':''}${c.id===rely.id?' <span class="tagchip" style="background:#f1ecfb;color:#4a3aa7">Tin cậy nhất</span>':''}
      <div style="font-size:.68rem;color:var(--muted)">Giao lần đầu tuyến ${(c.ok*100).toFixed(1)}%</div></div>
    <div style="text-align:right"><b class="num" style="font-size:.82rem">${fmt(fee(c))} ₫</b><div style="font-size:.68rem;color:var(--muted)">${c.eta}</div></div>
  </button>`).join('')}
  <div class="callout"><b>AI đề xuất ${sugg.ten}:</b> ${o.risk>=60?'đơn rủi ro cao — ưu tiên tỷ lệ giao lần đầu để giảm hoàn':'đơn rủi ro thấp — ưu tiên phí rẻ'}.</div>
  <button class="btn block primary" style="margin-top:10px" onclick="ship('${o.id}','${sel.id}')">Tạo vận đơn qua ${sel.ten}</button>`);
}
function ship(oid,cid){const o=ORDERS.find(x=>x.id===oid);o.st='dang-giao';S.vcSel=null;closeSheet();toast('Đã tạo vận đơn '+CARRIERS.find(c=>c.id===cid).ten+' cho '+oid);render();}

  else{const ta=document.createElement('textarea');ta.value=msg;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');}catch(e){}document.body.removeChild(ta);toast('Đã sao chép góp ý — dán vào Zalo gửi giúp em nhé');}

function qrSVG(px,quiet){const n=QRM.length,q=(quiet===undefined?2:quiet),t=n+q*2;
  let d='';
  for(let y=0;y<n;y++){let x=0;while(x<n){if(QRM[y][x]==='1'){let w=1;while(x+w<n&&QRM[y][x+w]==='1')w++;d+=`M${x+q},${y+q}h${w}v1h-${w}z`;x+=w;}else x++;}}
  return `<svg viewBox="0 0 ${t} ${t}" width="${px}" height="${px}" shape-rendering="crispEdges" style="display:block;width:100%;height:auto" role="img" aria-label="Mã QR tải ứng dụng Sổ Bán AI"><rect width="${t}" height="${t}" fill="#fff"/><path d="${d}" fill="#0b0b0b"/></svg>`;}
function qrPNG(){
  const n=QRM.length,q=2,t=n+q*2,scale=18,size=t*scale;
  const c=document.createElement('canvas');c.width=size;c.height=size;
  const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,size,size);g.fillStyle='#0b0b0b';
  for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(QRM[y][x]==='1')g.fillRect((x+q)*scale,(y+q)*scale,scale,scale);
  const a=document.createElement('a');a.href=c.toDataURL('image/png');a.download='SoBanAI-QR-tai-app.png';a.click();
  toast('Đã tải ảnh QR — gửi cho người khác qua Zalo/Messenger là họ tải được app');
}
function copyLink(){
  const ok=()=>toast('Đã sao chép link tải app: '+APPURL);
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(APPURL).then(ok).catch(()=>{fallbackCopy();ok();});}
  else{fallbackCopy();ok();}
}
function fallbackCopy(){const t=document.createElement('textarea');t.value=APPURL;document.body.appendChild(t);t.select();try{document.execCommand('copy');}catch(e){}document.body.removeChild(t);}
function shareApp(){
  const data={title:'Sổ Bán AI',text:'Tải Sổ Bán AI — trợ lý bán hàng đa kênh & thuế cho hộ kinh doanh:',url:APPURL};
  if(navigator.share){navigator.share(data).then(()=>toast('Đã mở bảng chia sẻ')).catch(()=>{});}
  else{copyLink();}
}

/* ===== v1.3: cử chỉ vuốt (góp ý Bobby 29/07) — vuốt sang trái: quay lại · vuốt sang phải: trang sau ===== */
(function(){
 const area=document.getElementById('view');
 const ORDER=TABS.map(t=>t.id);
 let sx=0,sy=0,t0=0,on=false;
 area.addEventListener('touchstart',e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY;t0=Date.now();on=true;},{passive:true});
 area.addEventListener('touchend',e=>{
   if(!on)return;on=false;
   if(document.getElementById('sheetwrap').classList.contains('open'))return;
   const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;
   if(Date.now()-t0>650)return;
   if(Math.abs(dx)<64||Math.abs(dy)>Math.abs(dx)*0.65)return;
   if(dx<0){ /* vuốt sang trái → quay lại */
     if(S.sub){go('more');}
     else{const i=ORDER.indexOf(S.tab);if(i>0)go(ORDER[i-1]);else toast('Đang ở màn đầu tiên');}
   }else{ /* vuốt sang phải → trang sau */
     if(S.sub)return;
     const i=ORDER.indexOf(S.tab);if(i<ORDER.length-1)go(ORDER[i+1]);else toast('Đang ở màn cuối');}
 },{passive:true});
})();
</script>
