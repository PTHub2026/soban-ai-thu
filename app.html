/* sheet */
.sheetwrap{position:absolute;inset:0;background:rgba(11,11,11,.45);display:none;align-items:flex-end;z-index:80}
.sheetwrap.open{display:flex}
.sheet{background:var(--surface);border-radius:22px 22px 0 0;width:100%;max-height:86%;overflow-y:auto;padding:8px 16px calc(18px + env(safe-area-inset-bottom));animation:up .22s ease}

.toast.show{opacity:.95}

.progress{height:6px;background:#eceae4;border-radius:99px;overflow:hidden;margin:6px 0}

/* charts */
function spark(vals,color,h){h=h||36;const w=150,mx=Math.max(...vals),mn=Math.min(...vals);
 const X=i=>3+i*(w-6)/(vals.length-1),Y=v=>h-5-(v-mn)/((mx-mn)||1)*(h-12);
 const pts=vals.map((v,i)=>X(i)+','+Y(v)).join(' ');
 return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="width:100%;height:${h}px;display:block"><polygon points="3,${h-2} ${pts} ${w-3},${h-2}" fill="${color}" opacity=".1"/><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" vector-effect="non-scaling-stroke"/><circle cx="${X(vals.length-1)}" cy="${Y(vals[vals.length-1])}" r="3" fill="${color}"/></svg>`;}
function donutMulti(segs,size,cl,cs){size=size||128;const r=(size-22)/2,c=2*Math.PI*r,tot=segs.reduce((a,s)=>a+s[1],0);let off=0,g='';
 segs.forEach(s=>{const len=s[1]/tot*c;g+=`<circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${s[2]}" stroke-width="15" stroke-dasharray="${Math.max(.5,len-2.4)} ${c}" stroke-dashoffset="${-off}" transform="rotate(-90 ${size/2} ${size/2})"/>`;off+=len;});
 return `<div style="display:flex;align-items:center;gap:13px"><svg viewBox="0 0 ${size} ${size}" style="width:${size*0.82}px;flex-shrink:0">${g}<text class="v" x="50%" y="48%" text-anchor="middle" font-size="${size/6.4}" font-weight="700" fill="#0b0b0b">${cl}</text><text x="50%" y="48%" dy="${size/8}" text-anchor="middle" font-size="${size/13}" fill="#6b6963">${cs||''}</text></svg><div class="statlegend" style="flex:1">${segs.map(s=>`<span><i style="background:${s[2]}"></i>${s[0]}<b class="num">${Math.round(s[1]/tot*100)}%</b></span>`).join('')}</div></div>`;}
function colChart(labels,vals,color){const W=340,H=150,P={l:26,r:6,t:16,b:20};
 const mx=Math.ceil(Math.max(...vals)*1.15),pw=(W-P.l-P.r)/vals.length,bw=pw*.58;
 const Y=v=>P.t+(1-v/mx)*(H-P.t-P.b);let g='';
 for(let k=0;k<=3;k++){const v=mx*k/3,y=Y(v);g+=`<line x1="${P.l}" y1="${y}" x2="${W-P.r}" y2="${y}" stroke="#e5e4de"/><text class="v" x="${P.l-5}" y="${y+3}" font-size="8.5" fill="#6b6963" text-anchor="end">${Math.round(v)}</text>`;}
 const mxi=vals.indexOf(Math.max(...vals));
 vals.forEach((v,i)=>{const x=P.l+i*pw+(pw-bw)/2,y=Y(v),h=Y(0)-y;
  g+=`<path d="M${x},${y+3} a3,3 0 0 1 3,-3 h${bw-6} a3,3 0 0 1 3,3 v${h-3} h${-bw} Z" fill="${color}"/>`;
  if(i===mxi||i===vals.length-1)g+=`<text class="v" x="${x+bw/2}" y="${y-4}" font-size="8.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">${v}</text>`;
  g+=`<text x="${x+bw/2}" y="${H-6}" font-size="8.5" fill="#6b6963" text-anchor="middle">${labels[i]}</text>`;});
 return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">${g}</svg>`;}
function curveChart(vals,color){const W=340,H=140,P={l:26,r:8,t:12,b:16},n=vals.length;
 const mx=Math.ceil(Math.max(...vals)*1.15);
 const X=i=>P.l+i*(W-P.l-P.r)/(n-1),Y=v=>P.t+(1-v/mx)*(H-P.t-P.b);
 let g='';for(let k=0;k<=3;k++){const v=mx*k/3,y=Y(v);g+=`<line x1="${P.l}" y1="${y}" x2="${W-P.r}" y2="${y}" stroke="#e5e4de"/><text class="v" x="${P.l-5}" y="${y+3}" font-size="8.5" fill="#6b6963" text-anchor="end">${Math.round(v)}</text>`;}
 let d='M'+X(0)+','+Y(vals[0]);
 for(let i=0;i<n-1;i++){const x0=X(Math.max(0,i-1)),y0=Y(vals[Math.max(0,i-1)]),x1=X(i),y1=Y(vals[i]),x2=X(i+1),y2=Y(vals[i+1]),x3=X(Math.min(n-1,i+2)),y3=Y(vals[Math.min(n-1,i+2)]);
  d+=` C${(x1+(x2-x0)/6).toFixed(1)},${(y1+(y2-y0)/6).toFixed(1)} ${(x2-(x3-x1)/6).toFixed(1)},${(y2-(y3-y1)/6).toFixed(1)} ${x2.toFixed(1)},${y2.toFixed(1)}`;}
 for(let i=0;i<n;i+=5){g+=`<text x="${X(i)}" y="${H-4}" font-size="8.5" fill="#6b6963" text-anchor="middle">${i+1}</text>`;}
 const li=n-1;
 return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">${g}<path d="${d} L${X(li)},${Y(0)} L${X(0)},${Y(0)} Z" fill="${color}" opacity=".08"/><path d="${d}" fill="none" stroke="${color}" stroke-width="2"/><circle cx="${X(li)}" cy="${Y(vals[li])}" r="3.4" fill="${color}" stroke="#fff" stroke-width="1.6"/></svg>`;}
function hbars(rows){const max=Math.max(...rows.map(r=>r[1]));
 return rows.map(r=>`<div style="display:flex;align-items:center;gap:8px;margin:7px 0"><span style="flex:0 0 66px;font-size:.7rem;color:var(--ink2)">${r[0]}</span><div style="flex:1;height:13px;background:#f0efec;border-radius:5px;overflow:hidden"><i style="display:block;height:100%;width:${r[1]/max*100}%;background:${r[2]};border-radius:5px"></i></div><b class="num" style="font-size:.72rem;min-width:32px;text-align:right">${r[3]??r[1]}</b></div>`).join('');}

function carrierSheet(oid){
  const o=ORDERS.find(x=>x.id===oid);
  const act=CARRIERS.filter(c=>c.st!=='soon');
  const fee=c=>c.phi+(o.cod>700000?3000:0);
  const cheap=act.reduce((a,b)=>fee(a)<=fee(b)?a:b);
  const fast=act.reduce((a,b)=>a.etaH<=b.etaH?a:b);
  const rely=act.reduce((a,b)=>a.ok>=b.ok?a:b);
  const sugg=o.risk>=60?rely:cheap;
  const sel=act.find(c=>c.id===S.vcSel)||sugg;
  openSheet(`<h2>Chọn hãng vận chuyển · ${o.id}</h2>
  <div style="font-size:.72rem;color:var(--ink2)">${o.dc} · COD <b class="num">${fmt(o.cod)} ₫</b> · rủi ro ${o.risk}/100</div>

    <div style="text-align:right"><b class="num" style="font-size:.82rem">${fmt(fee(c))} ₫</b><div style="font-size:.68rem;color:var(--muted)">${c.eta}</div></div>
  </button>`).join('')}
  <div class="callout"><b>AI đề xuất ${sugg.ten}:</b> ${o.risk>=60?'đơn rủi ro cao — ưu tiên tỷ lệ giao lần đầu để giảm hoàn':'đơn rủi ro thấp — ưu tiên phí rẻ'}.</div>
  <button class="btn block primary" style="margin-top:10px" onclick="ship('${o.id}','${sel.id}')">Tạo vận đơn qua ${sel.ten}</button>`);
}

function notiSave(i){

  const TYPES=['Báo cáo','Rủi ro','COD','Thuế','Hệ thống'];
  const picked=TYPES.filter((t,k)=>{const e=document.getElementById('nt'+k);return e&&e.checked;});

/* QR encoder rut gon: byte mode, muc sua loi M, phien ban 1..10 — du cho link gioi thieu */
function qrEncode(str){
  const data = (function(s){const o=[];for(const ch of unescape(encodeURIComponent(s)))o.push(ch.charCodeAt(0));return o;})(str);
  const SPEC = { /* v: [ec_per_block, g1_blocks, g1_dc, g2_blocks, g2_dc] */
    1:[10,1,16,0,0], 2:[16,1,28,0,0], 3:[26,1,44,0,0], 4:[18,2,32,0,0], 5:[24,2,43,0,0],
    6:[16,4,27,0,0], 7:[18,4,31,0,0], 8:[22,2,38,2,39], 9:[22,3,36,2,37], 10:[26,4,43,1,44] };
  const CAP = {1:16,2:28,3:44,4:64,5:86,6:108,7:124,8:154,9:182,10:216};
  let ver = 0;
  for (let v=1; v<=6; v++){ const need = Math.ceil((4 + 8 + data.length*8)/8); if (need <= CAP[v]) { ver=v; break; } }
  if (!ver) throw new Error('chuoi qua dai cho QR rut gon');
  const [ecLen,g1,dc1,g2,dc2] = SPEC[ver];
  const totalData = CAP[ver];

  // --- bit stream ---
  let bits = [];
  const push = (val,len)=>{ for(let i=len-1;i>=0;i--) bits.push((val>>i)&1); };
  push(4,4); push(data.length,8); data.forEach(b=>push(b,8));
  const cap = totalData*8;
  for (let i=0;i<4 && bits.length<cap;i++) bits.push(0);
  while (bits.length % 8) bits.push(0);
  const PAD=[0xEC,0x11]; let pi=0;
  const bytes=[]; for(let i=0;i<bits.length;i+=8){let b=0;for(let j=0;j<8;j++)b=(b<<1)|bits[i+j];bytes.push(b);}
  while (bytes.length < totalData) bytes.push(PAD[pi++%2]);

  // --- GF(256) ---
  const EXP=new Array(512), LOG=new Array(256);
  for(let i=0,x=1;i<255;i++){EXP[i]=x;LOG[x]=i;x<<=1;if(x&0x100)x^=0x11D;}
  for(let i=255;i<512;i++)EXP[i]=EXP[i-255];
  const mul=(a,b)=> (a===0||b===0)?0:EXP[LOG[a]+LOG[b]];
  function genPoly(n){ let g=[1]; for(let i=0;i<n;i++){ const ng=new Array(g.length+1).fill(0);
      for(let j=0;j<g.length;j++){ ng[j]^=mul(g[j],1); ng[j+1]^=mul(g[j],EXP[i]); } g=ng; } return g; }
  function ecFor(block,n){ const g=genPoly(n); const res=block.concat(new Array(n).fill(0));
    for(let i=0;i<block.length;i++){ const f=res[i]; if(f===0)continue; for(let j=0;j<g.length;j++) res[i+j]^=mul(g[j],f); }
    return res.slice(block.length); }

  // --- blocks ---
  const blocks=[], ecs=[]; let p=0;
  for(let i=0;i<g1;i++){ const b=bytes.slice(p,p+dc1); p+=dc1; blocks.push(b); ecs.push(ecFor(b,ecLen)); }
  for(let i=0;i<g2;i++){ const b=bytes.slice(p,p+dc2); p+=dc2; blocks.push(b); ecs.push(ecFor(b,ecLen)); }
  const inter=[]; const maxD=Math.max(dc1,dc2||0);
  for(let i=0;i<maxD;i++) blocks.forEach(b=>{ if(i<b.length) inter.push(b[i]); });
  for(let i=0;i<ecLen;i++) ecs.forEach(e=>inter.push(e[i]));

  // --- matrix ---
  const size = ver*4+17;
  const M = Array.from({length:size},()=>new Array(size).fill(null));
  const set=(r,c,v)=>{ M[r][c]=v; };
  const finder=(r,c)=>{ for(let i=-1;i<=7;i++)for(let j=-1;j<=7;j++){ const rr=r+i, cc=c+j; if(rr<0||cc<0||rr>=size||cc>=size)continue;
      const on = (i>=0&&i<=6&&(j===0||j===6)) || (j>=0&&j<=6&&(i===0||i===6)) || (i>=2&&i<=4&&j>=2&&j<=4); set(rr,cc,on?1:0); } };
  finder(0,0); finder(0,size-7); finder(size-7,0);
  for(let i=8;i<size-8;i++){ set(6,i,i%2===0?1:0); set(i,6,i%2===0?1:0); }
  const AL={1:[],2:[6,18],3:[6,22],4:[6,26],5:[6,30],6:[6,34],7:[6,22,38],8:[6,24,42],9:[6,26,46],10:[6,28,50]}[ver];
  for(const r of AL) for(const c of AL){
    if((r<=8&&c<=8)||(r<=8&&c>=size-9)||(r>=size-9&&c<=8)) continue;
    for(let i=-2;i<=2;i++)for(let j=-2;j<=2;j++) set(r+i,c+j,(Math.abs(i)===2||Math.abs(j)===2||(i===0&&j===0))?1:0); }
  set(size-8,8,1);                                   // dark module
  const reserved=[]; for(let i=0;i<9;i++){reserved.push([8,i],[i,8]);} for(let i=0;i<8;i++){reserved.push([8,size-1-i],[size-1-i,8]);}
  reserved.forEach(([r,c])=>{ if(M[r][c]===null) M[r][c]=0; });

  // --- place data ---
  const isFree=(r,c)=>M[r][c]===null;
  const stream=[]; inter.forEach(b=>{ for(let i=7;i>=0;i--) stream.push((b>>i)&1); });
  let idx=0, up=true;
  for(let col=size-1; col>0; col-=2){
    if(col===6) col--;
    for(let k=0;k<size;k++){
      const row = up ? size-1-k : k;
      for(const c of [col, col-1]) if(isFree(row,c)) M[row][c] = (idx<stream.length? stream[idx++] : 0) ? 1 : 0;
    }
    up=!up;
  }
  // --- mask + format ---
  const MASKS=[ (r,c)=>(r+c)%2===0, (r,c)=>r%2===0, (r,c)=>c%3===0, (r,c)=>(r+c)%3===0,
    (r,c)=>(Math.floor(r/2)+Math.floor(c/3))%2===0, (r,c)=>((r*c)%2)+((r*c)%3)===0,
    (r,c)=>(((r*c)%2)+((r*c)%3))%2===0, (r,c)=>(((r+c)%2)+((r*c)%3))%2===0 ];
  const isFunc = Array.from({length:size},()=>new Array(size).fill(false));
  { const t=Array.from({length:size},()=>new Array(size).fill(null));
    const f2=(r,c)=>{for(let i=-1;i<=7;i++)for(let j=-1;j<=7;j++){const rr=r+i,cc=c+j;if(rr<0||cc<0||rr>=size||cc>=size)continue;t[rr][cc]=1;}};
    f2(0,0); f2(0,size-7); f2(size-7,0);
    for(let i=0;i<size;i++){t[6][i]=1;t[i][6]=1;}
    for(const r of AL) for(const c of AL){ if((r<=8&&c<=8)||(r<=8&&c>=size-9)||(r>=size-9&&c<=8))continue;
      for(let i=-2;i<=2;i++)for(let j=-2;j<=2;j++) t[r+i][c+j]=1; }
    for(let i=0;i<9;i++){t[8][i]=1;t[i][8]=1;} for(let i=0;i<8;i++){t[8][size-1-i]=1;t[size-1-i][8]=1;}
    t[size-8][8]=1;
    for(let r=0;r<size;r++)for(let c=0;c<size;c++) isFunc[r][c]=t[r][c]===1; }

  function penalty(m){
    let s=0;
    for(let r=0;r<size;r++){ let run=1; for(let c=1;c<size;c++){ if(m[r][c]===m[r][c-1]){run++;} else { if(run>=5)s+=3+(run-5); run=1; } } if(run>=5)s+=3+(run-5); }
    for(let c=0;c<size;c++){ let run=1; for(let r=1;r<size;r++){ if(m[r][c]===m[r-1][c]){run++;} else { if(run>=5)s+=3+(run-5); run=1; } } if(run>=5)s+=3+(run-5); }
    for(let r=0;r<size-1;r++)for(let c=0;c<size-1;c++){ const v=m[r][c]; if(v===m[r][c+1]&&v===m[r+1][c]&&v===m[r+1][c+1]) s+=3; }
    const P=[1,0,1,1,1,0,1], look=(arr)=>{ let n=0; for(let i=0;i+6<arr.length;i++){ let ok=true; for(let j=0;j<7;j++) if(arr[i+j]!==P[j]){ok=false;break;}
        if(ok){ const before=arr.slice(Math.max(0,i-4),i), after=arr.slice(i+7,i+11);
          if(before.length===4&&before.every(x=>x===0)) n++; if(after.length===4&&after.every(x=>x===0)) n++; } } return n; };
    for(let r=0;r<size;r++) s+=40*look(m[r]);
    for(let c=0;c<size;c++) s+=40*look(m.map(row=>row[c]));
    let dark=0; m.forEach(row=>row.forEach(v=>dark+=v));
    s += 10*Math.floor(Math.abs(dark*100/(size*size)-50)/5);
    return s;
  }
  const FMT_M = {0:0x5412,1:0x5125,2:0x5E7C,3:0x5B4B,4:0x45F9,5:0x40CE,6:0x4F97,7:0x4AA0};
  let best=null, bestMask=0, bestScore=Infinity;
  for(let mk=0;mk<8;mk++){
    const m = M.map((row,r)=>row.map((v,c)=> isFunc[r][c] ? v : (MASKS[mk](r,c) ? v^1 : v)));
    const fmt = FMT_M[mk];
    for(let i=0;i<15;i++){ const bit=(fmt>>(14-i))&1;   /* dat bit cao truoc, dung chuan ISO 18004 */
      if(i<6) m[8][i]=bit; else if(i===6) m[8][7]=bit; else if(i===7) m[8][8]=bit; else if(i===8) m[7][8]=bit; else m[14-i][8]=bit;
      if(i<7) m[size-1-i][8]=bit; else m[8][size-15+i]=bit; }   /* ban sao 2: 7 bit dau o cot 8, 8 bit sau o hang 8 */
    m[size-8][8]=1;
    const sc = penalty(m);
    if(sc<bestScore){bestScore=sc;best=m;bestMask=mk;}
  }
  return best.map(r=>r.join(''));
}

function qrMatrix(text){ try{ return text ? qrEncode(text) : QRM; }catch(e){ return QRM; } }
function qrSVG(px,quiet,text){const G=qrMatrix(text),n=G.length,q=(quiet===undefined?2:quiet),t=n+q*2;
  let d='';
  for(let y=0;y<n;y++){let x=0;while(x<n){if(G[y][x]==='1'){let w=1;while(x+w<n&&G[y][x+w]==='1')w++;d+=`M${x+q},${y+q}h${w}v1h-${w}z`;x+=w;}else x++;}}
  return `<svg viewBox="0 0 ${t} ${t}" width="${px}" height="${px}" shape-rendering="crispEdges" style="display:block;width:100%;height:auto" role="img" aria-label="Mã QR tải ứng dụng Sổ Bán AI"><rect width="${t}" height="${t}" fill="#fff"/><path d="${d}" fill="#0b0b0b"/></svg>`;}
function qrPNG(text){
  const G=qrMatrix(text||refLink()),n=G.length,q=2,t=n+q*2,scale=Math.max(8,Math.round(520/(n+4))),size=t*scale;
  const c=document.createElement('canvas');c.width=size;c.height=size;
  const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,size,size);g.fillStyle='#0b0b0b';
  for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(G[y][x]==='1')g.fillRect((x+q)*scale,(y+q)*scale,scale,scale);
  const ma=refSlug(myRef());
  const a=document.createElement('a');a.href=c.toDataURL('image/png');a.download='SoBanAI-QR'+(ma?'-'+ma:'')+'.png';a.click();
  toast(ma?('Đã tải ảnh QR có mã giới thiệu «'+ma+'» — ai quét mã này đều tính cho anh/chị'):'Đã tải ảnh QR — gửi qua Zalo/Messenger là họ tải được app');
}
function copyLink(){
  const L=refLink();
  const ok=()=>toast('Đã sao chép link tải app: '+L);
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(L).then(ok).catch(()=>{fallbackCopy(L);ok();});}
  else{fallbackCopy(L);ok();}
}
function fallbackCopy(v){const t=document.createElement('textarea');t.value=v||refLink();document.body.appendChild(t);t.select();try{document.execCommand('copy');}catch(e){}document.body.removeChild(t);}
function myRef(){return lsGet('sbai_myref','');}
function refSlug(v){return String(v||'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,32);}
function refLink(){const r=refSlug(myRef());return r?APPURL+'?ref='+r:APPURL;}
function refPreview(){
  const el=document.getElementById('refin'); const v=refSlug(el&&el.value); lsSet('sbai_myref',v);
  const L=refLink();
  const a=document.getElementById('reflink'); if(a)a.textContent=L;
  const b=document.getElementById('qrlinktxt'); if(b)b.textContent=L;
  const c=document.getElementById('qrbig'); if(c)c.innerHTML=qrSVG(204,2,L);
  const d=document.getElementById('qrnote'); if(d)d.textContent = v ? ('Mã QR này đã gắn mã giới thiệu «'+v+'» — ai quét đều tính cho anh/chị.') : 'Nhập mã giới thiệu bên dưới để biết ai mời được bao nhiêu người.';
}

function readRefInput(){const el=document.getElementById('refin');const v=refSlug(el&&el.value);lsSet('sbai_myref',v);const out=document.getElementById('reflink');if(out)out.textContent=refLink();return refLink();}
function copyRefLink(){const l=readRefInput();const done=()=>toast(l===APPURL?'Đã sao chép link (chưa nhập mã giới thiệu)':'Đã sao chép link giới thiệu: '+l);
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(l).then(done).catch(()=>{fbCopy(l);done();});}else{fbCopy(l);done();}}
function fbCopy(v){const t=document.createElement('textarea');t.value=v;document.body.appendChild(t);t.select();try{document.execCommand('copy');}catch(e){}document.body.removeChild(t);}
function shareRefLink(){const l=readRefInput();
  if(navigator.share){navigator.share({title:'Sổ Bán AI',text:'Mời anh/chị dùng thử Sổ Bán AI:',url:l}).then(()=>toast('Đã mở bảng chia sẻ')).catch(()=>{});}
  else{copyRefLink();}}
function shareApp(){
  const data={title:'Sổ Bán AI',text:'Tải Sổ Bán AI — trợ lý bán hàng đa kênh & thuế cho hộ kinh doanh:',url:refLink()};

  else{copyLink();}

/* ===== v1.3: cử chỉ vuốt (góp ý Bobby 29/07) — vuốt sang trái: quay lại · vuốt sang phải: trang sau ===== */
(function(){
 const area=document.getElementById('view');
 const ORDER=TABS.map(t=>t.id);
 let sx=0,sy=0,t0=0,on=false;
 area.addEventListener('touchstart',e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY;t0=Date.now();on=true;},{passive:true});
 area.addEventListener('touchend',e=>{
   if(!on)return;on=false;
   if(document.getElementById('sheetwrap').classList.contains('open'))return;
   const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;
   if(Date.now()-t0>650)return;
   if(Math.abs(dx)<64||Math.abs(dy)>Math.abs(dx)*0.65)return;
   if(dx<0){ /* vuốt sang trái → quay lại */
     if(S.sub){go('more');}
     else{const i=ORDER.indexOf(S.tab);if(i>0)go(ORDER[i-1]);else toast('Đang ở màn đầu tiên');}
   }else{ /* vuốt sang phải → trang sau */
     if(S.sub)return;
     const i=ORDER.indexOf(S.tab);if(i<ORDER.length-1)go(ORDER[i+1]);else toast('Đang ở màn cuối');}
 },{passive:true});
})();
</script>
